name: prono
on:
  schedule:
    - cron: "*/10 7-22 * * *"   # UTC : couvre 8h-23h a Paris ete comme hiver
  workflow_dispatch:
    inputs:
      mode:
        description: "tick (tout) ou chat (repondre vite)"
        default: "tick"
concurrency:
  group: prono
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prono
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          python3 -c "import requests" 2>/dev/null || pip install -q requests
          python3 prono_cloud.py "${{ github.event.inputs.mode || 'tick' }}"
